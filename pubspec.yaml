name: gestor_gado
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # INTERNACIONALIZAÇÃO (Datas em Português)
  flutter_localizations:
    sdk: flutter

  # PACOTES DO PROJETO
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  provider: ^6.1.5+1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  pdf: ^3.10.7
  printing: ^5.11.1
  csv: ^6.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  fl_chart: ^0.66.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  file_picker: ^10.3.8
  permission_handler: ^11.3.0 # Gerenciador de Permissões (Correção Bateria)
  archive: ^3.6.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # GERADOR DE ÍCONES (NOVO!)
  flutter_launcher_icons: ^0.13.1

# CONFIGURAÇÃO DO ÍCONE
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png" # <--- ONDE SUA FOTO TEM QUE ESTAR
  min_sdk_android: 21

flutter:
  uses-material-design: true